# master へのマージ前にビルドとテストの通過を機械的に保証するための CI
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ジョブ名はブランチ保護の Required status check 名として参照されるため、変更時は保護設定も更新する
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore DevNext.slnx

      - name: Build
        run: dotnet build DevNext.slnx --no-restore --configuration Release

      # テストは DB・SMTP をモックしているため、SQL Server なしで実行できる
      - name: Test
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
